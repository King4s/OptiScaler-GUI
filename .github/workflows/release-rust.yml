name: Release (Rust)

# CalVer tags: v2026.7.0, v2026.8.0-beta.1, ...
on:
  push:
    tags:
      - 'v20*'

permissions:
  contents: write

defaults:
  run:
    working-directory: rust

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Match the tag, executable version and release notes
        id: metadata
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read locked workspace metadata' }
          $version = ($metadata.packages | Where-Object name -eq 'optiscaler-gui').version
          if (!$version -or $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match the GUI version' }
          $notes = "docs/releases/$version.md"
          if (!(Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $notes) -PathType Leaf)) { throw "Missing $notes" }
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - run: cargo test --workspace --locked

      - run: cargo build --release --workspace --locked

      - name: Stage artifacts
        shell: pwsh
        run: |
          $exe = "target/release/OptiScaler-GUI.exe"
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "OptiScaler-GUI.exe: $mb MB"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe out/OptiScaler-GUI.exe
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (!(Test-Path $sevenZip)) { throw '7-Zip is missing from the Windows runner' }
          Push-Location out
          try {
            & $sevenZip a -t7z -mx=9 'OptiScaler-GUI.7z' 'OptiScaler-GUI.exe'
            if ($LASTEXITCODE -ne 0) { throw '7z creation failed' }
            & $sevenZip t 'OptiScaler-GUI.7z'
            if ($LASTEXITCODE -ne 0) { throw '7z verification failed' }
          } finally { Pop-Location }
          @('OptiScaler-GUI.exe', 'OptiScaler-GUI.7z') | ForEach-Object {
            $hash = (Get-FileHash (Join-Path out $_) -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          } | Out-File -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.metadata.outputs.notes }}
          files: |
            rust/out/OptiScaler-GUI.exe
            rust/out/OptiScaler-GUI.7z
            rust/out/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true
