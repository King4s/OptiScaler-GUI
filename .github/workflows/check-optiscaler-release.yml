name: Check OptiScaler Upstream Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Notify maintainers without changing application code
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = {owner: 'optiscaler', repo: 'OptiScaler'};
            const {data: release} = await github.rest.repos.getLatestRelease(upstream);
            const title = `OptiScaler ${release.tag_name} released — review for GUI compatibility`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', labels: 'optiscaler-update', per_page: 100
            });
            if (issues.some(issue => issue.title === title)) return;
            try {
              await github.rest.issues.createLabel({...context.repo, name: 'optiscaler-update', color: '0075ca', description: 'Upstream release notification'});
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.create({
              ...context.repo, title, labels: ['optiscaler-update'],
              body: `Review the official release: ${release.html_url}\n\n` +
                '- [ ] Check `rust/crates/opticore/src/install/github.rs` endpoint, archive selection and digest handling.\n' +
                '- [ ] Exercise real 7z extraction and transactional install/update/uninstall in disposable folders.\n' +
                '- [ ] Review payload filenames, resolver targets and config changes.\n' +
                '- [ ] Verify separate pinned community runtime behavior without modifying official caches.\n' +
                '- [ ] Update CHANGELOG/docs and run locked workspace tests, fmt and strict Clippy.\n\n' +
                'Notification only; no automatic application commit, version bump or release.'
            });
